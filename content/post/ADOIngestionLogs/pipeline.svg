  </g>
  <text x="90" y="80" font-size="15" font-weight="700" fill="#0f3d61">Logic App</text>
  <text x="90" y="96" font-size="10.5" fill="#5b7a99">(Service Principal auth)</text>

  <!-- step 1 -->
  <rect x="50" y="116" width="260" height="46" rx="8" fill="#ffffff" stroke="#cfe0f2" stroke-width="1"/>
  <circle cx="70" cy="139" r="11" fill="#0078d4"/>
  <text x="70" y="139" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="90" y="139" font-size="10.5" fill="#22303f" dominant-baseline="central">Recurrence trigger (every 5 min)</text>
  <!-- step 2 -->
  <rect x="50" y="172" width="260" height="46" rx="8" fill="#ffffff" stroke="#cfe0f2" stroke-width="1"/>
  <circle cx="70" cy="195" r="11" fill="#0078d4"/>
  <text x="70" y="195" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="90" y="195" font-size="10.5" fill="#22303f" dominant-baseline="central">Get secret from Key Vault</text>
  <!-- step 3 -->
  <rect x="50" y="228" width="260" height="46" rx="8" fill="#ffffff" stroke="#cfe0f2" stroke-width="1"/>
  <circle cx="70" cy="251" r="11" fill="#0078d4"/>
  <text x="70" y="251" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="90" y="251" font-size="10.5" fill="#22303f" dominant-baseline="central">Build startTime / endTime window</text>
  <!-- step 4 -->
  <rect x="50" y="284" width="260" height="46" rx="8" fill="#ffffff" stroke="#cfe0f2" stroke-width="1"/>
  <circle cx="70" cy="307" r="11" fill="#0078d4"/>
  <text x="70" y="307" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="90" y="307" font-size="10.5" fill="#22303f" dominant-baseline="central">HTTP GET &#8594; Azure DevOps API</text>

  <!-- Key Vault (official) -->
  <rect x="95" y="440" width="160" height="95" rx="10" fill="#ffffff" stroke="#d9a900" stroke-width="1.3"/>
  <g transform="translate(154,452) scale(2.3333)">
