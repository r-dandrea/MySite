  <text x="768" y="216" font-size="10" font-weight="700" fill="#3a7d3a">Yes</text>
  <text x="875" y="150" font-size="10.5" font-weight="700" fill="#3d566e" text-anchor="middle">POST</text>
  <text x="875" y="163" font-size="9.5" fill="#5b6b7b" text-anchor="middle">audience = https://monitor.azure.com</text>

