<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="600" viewBox="0 0 1660 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7b8b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1660" height="600" fill="#ffffff"/>

  <text x="40" y="36" font-size="17" font-weight="700" fill="#0f3d61">Azure DevOps &#8594; Microsoft Sentinel ingestion pipeline (service-principal based)</text>

  <!-- ============ LOGIC APP CONTAINER ============ -->
  <rect x="30" y="55" width="300" height="340" rx="12" fill="#f4f8fd" stroke="#0078d4" stroke-width="1.5"/>
  <!-- title icon: Logic Apps (official) -->
  <g transform="translate(48,66) scale(1.6667)">
    <defs><linearGradient id="la1" x1="9" y1="1.796" x2="9" y2="6.371" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9cebff"/><stop offset="1" stop-color="#50e6ff"/></linearGradient><linearGradient id="la2" x1="3.374" y1="12.14" x2="3.374" y2="18.457" gradientUnits="userSpaceOnUse"><stop offset="0.001" stop-color="#b4ec36"/><stop offset="1" stop-color="#86d633"/></linearGradient><linearGradient id="la3" x1="14.626" y1="12.14" x2="14.626" y2="18.457" gradientTransform="translate(-0.02 29.273) rotate(-90)" gradientUnits="userSpaceOnUse"><stop offset="0.001" stop-color="#b4ec36"/><stop offset="1" stop-color="#86d633"/></linearGradient></defs>
