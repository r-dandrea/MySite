  <text x="530" y="252" font-size="10.5" fill="#1f2d3d" text-anchor="middle">Audit Log API</text>

  <!-- arrow to diamond -->
  <line x1="605" y1="225" x2="632" y2="225" stroke="#6b7b8b" stroke-width="1.6" marker-end="url(#arrow)"/>

